<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 900"
  preserveAspectRatio="none"
>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03131a" />
      <stop offset="45%" stop-color="#062433" />
      <stop offset="100%" stop-color="#021017" />
    </linearGradient>

    <radialGradient id="glow1" cx="35%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#38d6c8" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#38d6c8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38d6c8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="72%" cy="62%" r="50%">
      <stop offset="0%" stop-color="#5aa7ff" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#5aa7ff" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#5aa7ff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow3" cx="52%" cy="80%" r="42%">
      <stop offset="0%" stop-color="#7c4dff" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#7c4dff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0" />
    </radialGradient>

    <filter id="blur80" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <filter id="blur40" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <linearGradient id="mesh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a3d4d" stop-opacity="0.0" />
      <stop offset="20%" stop-color="#1bc7b6" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#54aefc" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#9b6dff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a3d4d" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)" />

  <g filter="url(#blur80)">
    <ellipse cx="380" cy="250" rx="340" ry="220" fill="url(#glow1)">
      <animate attributeName="cx" values="350;430;350" dur="18s" repeatCount="indefinite" />
      <animate attributeName="cy" values="230;280;230" dur="15s" repeatCount="indefinite" />
    </ellipse>

    <ellipse cx="1040" cy="610" rx="420" ry="260" fill="url(#glow2)">
      <animate attributeName="cx" values="1000;1080;1000" dur="20s" repeatCount="indefinite" />
      <animate attributeName="cy" values="590;640;590" dur="17s" repeatCount="indefinite" />
    </ellipse>

    <ellipse cx="700" cy="760" rx="420" ry="180" fill="url(#glow3)">
      <animate attributeName="cx" values="660;740;660" dur="22s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <g opacity="0.9" filter="url(#blur40)">
    <path
      d="M0,220 C180,140 320,310 520,240 C700,180 820,70 1020,160 C1190,235 1280,340 1440,260 L1440,0 L0,0 Z"
      fill="url(#mesh)"
    >
      <animate attributeName="d"
        values="
          M0,220 C180,140 320,310 520,240 C700,180 820,70 1020,160 C1190,235 1280,340 1440,260 L1440,0 L0,0 Z;
          M0,210 C190,110 330,290 540,230 C720,170 840,90 1030,175 C1210,255 1290,330 1440,250 L1440,0 L0,0 Z;
          M0,220 C180,140 320,310 520,240 C700,180 820,70 1020,160 C1190,235 1280,340 1440,260 L1440,0 L0,0 Z"
        dur="16s" repeatCount="indefinite"
      />
    </path>

    <path
      d="M0,520 C220,460 360,620 590,560 C790,505 860,390 1070,440 C1230,480 1330,560 1440,520 L1440,900 L0,900 Z"
      fill="url(#mesh)"
    >
      <animate attributeName="d"
        values="
          M0,520 C220,460 360,620 590,560 C790,505 860,390 1070,440 C1230,480 1330,560 1440,520 L1440,900 L0,900 Z;
          M0,510 C230,470 370,640 610,570 C820,500 900,420 1090,455 C1250,485 1340,540 1440,510 L1440,900 L0,900 Z;
          M0,520 C220,460 360,620 590,560 C790,505 860,390 1070,440 C1230,480 1330,560 1440,520 L1440,900 L0,900 Z"
        dur="18s" repeatCount="indefinite"
      />
    </path>
  </g>
</svg>